name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Configure Offline Assets & Fix Build Paths
      run: |
        mkdir -p dist

        # 1. نقل ملفات المخرجات البرمجية بأمان بدون أخطاء مسارات
        if [ -d ".output/public" ]; then
          cp -r .output/public/. dist/ 2>/dev/null || true
        fi
        if [ -d ".output/client" ]; then
          cp -r .output/client/. dist/ 2>/dev/null || true
        fi
        if [ -d "build" ]; then
          cp -r build/. dist/ 2>/dev/null || true
        fi

        # 2. البحث عن أي ملف index.html تم إنشاؤه أثناء البناء
        INDEX_FOUND=$(find . -name "index.html" ! -path "./node_modules/*" ! -path "./android/*" ! -path "./.git/*" ! -path "./dist/*" | head -n 1)
        if [ -n "$INDEX_FOUND" ]; then
          cp "$INDEX_FOUND" dist/index.html
        elif [ -f "index.html" ]; then
          cp index.html dist/index.html
        fi

        # 3. التأكد من وجود index.html داخل dist لتفادي فشل Capacitor
        if [ ! -f "dist/index.html" ]; then
          echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

        # 4. تحويل المسارات إلى نسبية لتجنب الشاشة السوداء وإلغاء رابط السيرفر الخارجي للعمل أوفلاين
        node -e "
          const fs = require('fs');

          if (fs.existsSync('dist/index.html')) {
            let html = fs.readFileSync('dist/index.html', 'utf8');
            html = html.replace(/href=\"\//g, 'href=\"./').replace(/src=\"\//g, 'src=\"./');
            fs.writeFileSync('dist/index.html', html);
          }

          if (fs.existsSync('capacitor.config.json')) {
            let config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            delete config.server;
            config.webDir = 'dist';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          }
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
