name: Build Salman AI App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Ensure Dist Directory & Capacitor Config
      run: |
        mkdir -p dist
        touch dist/index.html
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.salman.ai",
          "appName": "Salman AI",
          "webDir": "dist",
          "server": {
            "url": "https://salman-ai.lovable.app",
            "cleartext": true
          },
          "android": {
            "backgroundColor": "#0B0B0B"
          }
        }
        EOF

    - name: Sync Capacitor
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Standalone APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: salman-ai-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
