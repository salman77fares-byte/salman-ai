name: Build Salman AI App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    # التطبيق يفتح النسخة المنشورة مباشرة (كل نشر في Lovable يصل للتطبيق فوراً)
    # ويحمل داخله صفحة عدم الاتصال والشعار لتعمل بدون إنترنت.
    - name: Prepare Native Web Shell
      run: |
        rm -rf dist && mkdir -p dist
        cp public/offline.html dist/offline.html
        cp public/logo.png dist/logo.png
        cat > dist/index.html << 'EOF'
        <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <script>location.replace(navigator.onLine ? "https://salman-ai.lovable.app/chat" : "offline.html");</script></head>
        <body style="background:#0b101b"></body></html>
        EOF

    - name: Add Android Platform
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Android Permissions
      run: |
        MANIFEST=android/app/src/main/AndroidManifest.xml
        PERMS='
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.microphone" android:required="false" />'
        sed -i '/android.permission.INTERNET/d' "$MANIFEST"
        awk -v perms="$PERMS" '/<application/ && !done { print perms; done=1 } { print }' "$MANIFEST" > /tmp/m.xml && mv /tmp/m.xml "$MANIFEST"
        sed -i 's|<application|<application android:usesCleartextTraffic="false"|' "$MANIFEST"
        grep -n "permission" "$MANIFEST"

    - name: App Icon From public/logo.png
      run: |
        sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
        RES=android/app/src/main/res
        rm -rf $RES/mipmap-anydpi-v26
        for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
          d=${pair%%:*}; s=${pair##*:}
          mkdir -p $RES/mipmap-$d
          for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
            convert public/logo.png -resize ${s}x${s} $RES/mipmap-$d/$n.png 2>/dev/null || cp -f public/logo.png $RES/mipmap-$d/$n.png
          done
        done

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # مفتاح توقيع ثابت بين البنيات حتى يُحدَّث التطبيق فوق النسخة السابقة دون حذفها
    - name: Restore Signing Key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: salman-ai-debug-keystore-v1

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: salman-ai-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
