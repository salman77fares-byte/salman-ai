name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Build Assets in dist/ (Fix Blank Screen)
        run: |
          mkdir -p dist
          # البحث الديناميكي عن المجلد الذي يحتوي على index.html ونسخ محتوياته إلى dist/
          INDEX_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "*/public/*" -not -path "*/dist/*" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            BUILD_DIR=$(dirname "$INDEX_PATH")
            echo "Found web build assets in: $BUILD_DIR"
            if [ "$BUILD_DIR" != "./dist" ] && [ "$BUILD_DIR" != "dist" ]; then
              cp -r $BUILD_DIR/* dist/
            fi
          else
            echo "Warning: index.html not found in subdirectories, checking public..."
            if [ -d "public" ]; then
              cp -r public/* dist/
            fi
          fi
          ls -la dist/

      - name: Generate App Icons
        run: |
          if [ -f "public/icon-512.png" ]; then
            npx @capacitor/assets generate --iconSource public/icon-512.png
          else
            echo "Icon public/icon-512.png not found, skipping asset generation."
          fi

      - name: Capacitor Sync & Re-create Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salman-ai-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
