name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Fix Dist Assets & Enable Offline Mode
      run: |
        mkdir -p dist

        # نقل ملفات المخرجات البرمجية إلى مجلد dist المطلوب لـ Capacitor
        if [ -d ".output/public" ]; then
          cp -r .output/public/* dist/ 2>/dev/null || true
        elif [ -d "dist/client" ]; then
          cp -r dist/client/* dist/ 2>/dev/null || true
        elif [ -d ".output" ]; then
          cp -r .output/* dist/ 2>/dev/null || true
        fi

        # التأكد من وجود ملف index.html داخل dist
        if [ ! -f "dist/index.html" ]; then
          FOUND_INDEX=$(find . -name "index.html" ! -path "./node_modules/*" ! -path "./android/*" ! -path "./.git/*" ! -path "./dist/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            cp "$FOUND_INDEX" dist/index.html
          else
            echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
        fi

        # إزالة رابط السيرفر الخارجي لضمان التشغيل الأوفلاين 100%
        node -e "
          const fs = require('fs');
          ['capacitor.config.ts', 'capacitor.config.json'].forEach(file => {
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8');
              c = c.replace(/server\s*:\s*\{[^}]*\},?/g, '');
              c = c.replace(/\"server\"\s*:\s*\{[^}]*\},?/g, '');
              fs.writeFileSync(file, c);
            }
          });
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png" "public/favicon.ico"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
