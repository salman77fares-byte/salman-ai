name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Locate Output Directory & Enable Offline Mode
      run: |
        mkdir -p dist

        # 1. البحث الآلي عن مجلد البناء الحقيقي الذي يحتوي على index.html
        BUILD_OUT=""
        if [ -f ".output/public/index.html" ]; then
          BUILD_OUT=".output/public"
        elif [ -f ".output/client/index.html" ]; then
          BUILD_OUT=".output/client"
        elif [ -f ".output/index.html" ]; then
          BUILD_OUT=".output"
        elif [ -f "dist/client/index.html" ]; then
          BUILD_OUT="dist/client"
        else
          FOUND_INDEX=$(find . -name "index.html" ! -path "./node_modules/*" ! -path "./android/*" ! -path "./.git/*" ! -path "./dist/index.html" ! -path "./public/*" ! -path "./src/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            BUILD_OUT=$(dirname "$FOUND_INDEX")
          fi
        fi

        echo "Detected Build Directory: $BUILD_OUT"

        # 2. نقل جميع ملفات البناء إلى مجلد dist
        if [ -n "$BUILD_OUT" ] && [ "$BUILD_OUT" != "dist" ]; then
          cp -r "$BUILD_OUT"/* dist/ 2>/dev/null || true
          cp -r "$BUILD_OUT"/.* dist/ 2>/dev/null || true
        fi

        # 3. التأكد من وجود index.html داخل dist
        if [ ! -f "dist/index.html" ]; then
          if [ -f "index.html" ]; then
            cp index.html dist/index.html
          else
            echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
        fi

        # 4. تفريغ خيار السيرفر الخارجي وتحديد webDir لتفعيل الأوفلاين
        node -e "
          const fs = require('fs');
          if (fs.existsSync('capacitor.config.json')) {
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            delete config.server;
            config.webDir = 'dist';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            console.log('Updated capacitor.config.json successfully');
          }
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
