name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Fix Dist Assets & Enable Offline Mode
      run: |
        # البحث عن ملف index.html المجمع بعد البناء ونقل المجلد بالكامل إلى dist
        if [ ! -f "dist/index.html" ]; then
          FOUND_INDEX=$(find . -maxdepth 3 -name "index.html" ! -path "./node_modules/*" ! -path "./android/*" ! -path "./.git/*" ! -path "./public/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            BUILD_DIR=$(dirname "$FOUND_INDEX")
            echo "Found build output at $BUILD_DIR"
            if [ "$BUILD_DIR" != "./dist" ] && [ "$BUILD_DIR" != "dist" ]; then
              mkdir -p dist
              cp -r "$BUILD_DIR"/* dist/
            fi
          fi
        fi

        # إزالة رابط السيرفر الخارجي ليعمل التطبيق كاملاً بدون إنترنت (Offline)
        node -e "
          const fs = require('fs');
          ['capacitor.config.ts', 'capacitor.config.json'].forEach(file => {
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8');
              c = c.replace(/server\s*:\s*\{[^}]*\},?/g, '');
              c = c.replace(/\"server\"\s*:\s*\{[^}]*\},?/g, '');
              fs.writeFileSync(file, c);
            }
          });
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png" "public/favicon.ico"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
