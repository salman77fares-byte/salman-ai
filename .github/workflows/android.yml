name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Prepare Web Assets for Capacitor
      run: |
        if [ -d ".output/public" ]; then
          cp -r .output/public dist
        elif [ ! -d "dist" ]; then
          mkdir dist
          touch dist/index.html
        fi

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom App Icon
      run: |
        if [ -f "public/favicon.png" ]; then
          mkdir -p assets
          cp public/favicon.png assets/icon.png
          cp public/favicon.png assets/icon-only.png
          cp public/favicon.png assets/icon-foreground.png
          cp public/favicon.png assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
