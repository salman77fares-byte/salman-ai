name: Build Salman AI App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets & Fix Black Screen Issues
      run: |
        # 1. تشغيل بناء المشروع
        npm run build || npx vite build || true

        # 2. تجميع وتصدير كافة مخرجات المجلدات
        mkdir -p dist
        if [ -d ".output/public" ]; then cp -r .output/public/* dist/; fi
        if [ -d "dist/client" ]; then cp -r dist/client/* dist/; fi
        if [ -d "build/client" ]; then cp -r build/client/* dist/; fi
        if [ -d "build" ] && [ "build" != "dist" ]; then cp -r build/* dist/; fi
        if [ -d "out" ]; then cp -r out/* dist/; fi

        # 3. التأكد من وجود index.html
        if [ ! -f "dist/index.html" ]; then
          FOUND_INDEX=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/android/*" ! -path "./dist/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            cp "$FOUND_INDEX" dist/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
        fi

        # 4. معالجة وتصحيح المسارات لمنع الشاشة السوداء
        python3 - << 'EOF'
        import os, glob, re

        dist_index = "dist/index.html"
        if os.path.exists(dist_index):
            with open(dist_index, "r", encoding="utf-8") as f:
                content = f.read()

            # تحويل المسارات المطلقة لنسبية
            content = re.sub(r'src=["\']/(?!/)', 'src="./', content)
            content = re.sub(r'href=["\']/(?!/)', 'href="./', content)

            # معالجة استدعاءات الجافاسكريبت
            js_files = glob.glob("dist/**/*.js", recursive=True) + glob.glob("dist/**/*.mjs", recursive=True)
            valid_js = [f for f in js_files if not f.endswith(".json")]
            if valid_js:
                main_js = sorted(valid_js, key=lambda x: os.path.getsize(x), reverse=True)[0]
                rel_js = os.path.relpath(main_js, "dist").replace("\\", "/")
                if "<script" not in content or "/src/" in content:
                    content = content.replace("</body>", f'<script type="module" src="./{rel_js}"></script></body>')

            with open(dist_index, "w", encoding="utf-8") as f:
                f.write(content)
            print("Prepared dist/index.html successfully!")
        EOF

    - name: Configure Capacitor Engine & Webview Settings
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.salman.ai",
          "appName": "Salman AI",
          "webDir": "dist",
          "server": {
            "androidScheme": "https",
            "cleartext": true
          },
          "android": {
            "backgroundColor": "#0B0B0B",
            "allowMixedContent": true,
            "webContentsDebuggingEnabled": true
          }
        }
        EOF

    - name: Sync Capacitor Native Project
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Remove Adaptive Icons & Force Full-Bleed Logo Icon
      run: |
        python3 -m pip install --quiet Pillow
        python3 - << 'EOF'
        import os, glob, shutil
        from PIL import Image

        logo_path = "public/logo.png"
        if not os.path.exists(logo_path):
            found = glob.glob("**/logo.png", recursive=True)
            if found:
                logo_path = found[0]

        if os.path.exists(logo_path):
            print(f"Processing logo image: {logo_path}")
            img = Image.open(logo_path).convert("RGBA")
            
            # قص الحواف الشفافة لجعل الشعار كبيراً وممتداً بالكامل
            bbox = img.getbbox()
            if bbox:
                img = img.crop(bbox)
            
            res_dir = "android/app/src/main/res"
            
            # حذف مجلدات الأيقونات التكيفية التي تجعل الأيقونة صغيرة بداخل أندرويد الحديث
            for anydpi in glob.glob(f"{res_dir}/mipmap-anydpi*"):
                shutil.rmtree(anydpi, ignore_errors=True)
            
            sizes = {
                "mipmap-mdpi": 48,
                "mipmap-hdpi": 72,
                "mipmap-xhdpi": 96,
                "mipmap-xxhdpi": 144,
                "mipmap-xxxhdpi": 192
            }
            
            for folder, size in sizes.items():
                target_dir = os.path.join(res_dir, folder)
                if os.path.exists(target_dir):
                    resized = img.resize((size, size), Image.Resampling.LANCZOS)
                    resized.save(os.path.join(target_dir, "ic_launcher.png"))
                    resized.save(os.path.join(target_dir, "ic_launcher_round.png"))
                    resized.save(os.path.join(target_dir, "ic_launcher_foreground.png"))
            print("Full-bleed icon generated successfully across all Android densities!")
        EOF

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Standalone APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Salman AI Release v1.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
