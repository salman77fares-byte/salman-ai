name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Configure Clean Dist & Enable Local Offline Mode
      run: |
        # 1. تنظيف وإعداد مجلد dist
        rm -rf dist
        mkdir -p dist

        # 2. نسخ مخرجات البناء الأصلية بالكامل من .output/public إلى dist دون التعديل على الكود
        if [ -d ".output/public" ]; then
          cp -r .output/public/. dist/
        elif [ -d ".output" ]; then
          cp -r .output/. dist/
        fi

        # 3. إزالة خيار السيرفر الخارجي وتعيين webDir إلى dist ليعمل التطبيق محلياً 100%
        node -e "
          const fs = require('fs');
          if (fs.existsSync('capacitor.config.json')) {
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            delete config.server;
            config.webDir = 'dist';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            console.log('Successfully updated capacitor.config.json for local offline mode');
          }
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
