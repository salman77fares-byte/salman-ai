name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Project
      run: npm run build

    - name: Configure Offline Assets & Fix Build Paths
      run: |
        # 1. إنشاء مجلد dist ونقل مخرجات البناء من .output/public إليه
        mkdir -p dist
        if [ -d ".output/public" ]; then
          cp -r .output/public/* dist/
        elif [ -d ".output" ]; then
          cp -r .output/* dist/
        fi

        # 2. التأكد من توفر index.html
        if [ ! -f "dist/index.html" ]; then
          FOUND_INDEX=$(find .output -name "index.html" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            cp "$FOUND_INDEX" dist/index.html
          fi
        fi

        # 3. تحويل المسارات إلى نسبية وتفريغ خيار السيرفر الخارجي للعمل أوفلاين 100%
        node -e "
          const fs = require('fs');

          // تعديل المسارات المطلقة إلى نسبية في index.html ليعمل محلياً
          if (fs.existsSync('dist/index.html')) {
            let html = fs.readFileSync('dist/index.html', 'utf8');
            html = html.replace(/href=\"\//g, 'href=\"./').replace(/src=\"\//g, 'src=\"./');
            fs.writeFileSync('dist/index.html', html);
          }

          // إزالة خيار السيرفر الخارجي من capacitor.config.json لتفعيل وضع الأوفلاين
          if (fs.existsSync('capacitor.config.json')) {
            let config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            delete config.server;
            config.webDir = 'dist';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          }
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
