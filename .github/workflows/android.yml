name: Build Offline Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Force Vite Production Build
      run: |
        # بناء التطبيق محلياً وتوليد ملفات الويب الحقيقية
        npx vite build --outDir dist

    - name: Ensure Local Config File
      run: |
        # ضبط الإعدادات محلياً بدون أي سيرفر خارجي
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "app.lovable.zadalduat",
          "appName": "زاد الدعاة",
          "webDir": "dist",
          "android": {
            "backgroundColor": "#0B0B0B"
          }
        }
        EOF

    - name: Sync Capacitor Local Assets
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Fix Android Launcher Icons
      run: |
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        ICON_SRC=$(find public src -name "*icon-512*.png" -o -name "*logo*.png" -o -name "*favicon*.png" | head -n 1)
        if [ -z "$ICON_SRC" ]; then ICON_SRC="public/icon-512.png"; fi
        
        for dir in android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp -f "$ICON_SRC" "$dir/ic_launcher.png"
            cp -f "$ICON_SRC" "$dir/ic_launcher_round.png"
            cp -f "$ICON_SRC" "$dir/ic_launcher_foreground.png"
          fi
        done

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Standalone APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-offline-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
