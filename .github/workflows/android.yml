name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Pure Static SPA for Offline Android
      run: |
        # 1. تنفيذ أمر البناء الخاص بـ TanStack / Vite
        npm run build || npx vite build --base=./

        # 2. إنشاء المجلد الرئيسي للـ Web Assets
        mkdir -p dist

        # 3. دمج ومزامنة كافة المخرجات من dist/client و .output/public إلى dist
        [ -d "dist/client" ] && cp -r dist/client/* dist/ 2>/dev/null || true
        [ -d ".output/public" ] && cp -r .output/public/* dist/ 2>/dev/null || true
        [ -d "build" ] && cp -r build/* dist/ 2>/dev/null || true

        # 4. البحث عن أي ملف index.html تم توليده ونقله مباشرة لمجلد dist الرئيسي
        FOUND_INDEX=$(find . -maxdepth 5 -name "index.html" -not -path "*/node_modules/*" -not -path "./dist/index.html" | head -n 1)
        if [ -n "$FOUND_INDEX" ]; then
          cp "$FOUND_INDEX" dist/index.html
        fi

        # 5. خطة حماية حاسمة: إنشاء index.html موجه في حال عدم وجوده لمنع توقف Sync
        if [ ! -f "dist/index.html" ]; then
          if [ -f "index.html" ]; then
            cp index.html dist/index.html
          else
            echo '<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
        fi

        # 6. إعداد ملف capacitor.config.json بالتكوين المعتمد
        node -e "
          const fs = require('fs');
          const config = {
            appId: 'com.salman.ai',
            appName: 'Salman AI',
            webDir: 'dist',
            android: {
              backgroundColor: '#0B0B0B'
            }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
