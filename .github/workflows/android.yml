name: Build Capacitor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Pure Static SPA for Offline Android
      run: |
        # 1. تشغيل أمر البناء
        npm run build || npx vite build --base=./

        # 2. إنشاء مجلد dist المطلوب
        mkdir -p dist

        # 3. فحص ونقل ملفات البناء من المجلدات المتوقعة
        if [ -f ".output/public/index.html" ]; then
          cp -r .output/public/* dist/
        elif [ -f "dist/client/index.html" ]; then
          cp -r dist/client/* dist/
        elif [ -f "build/index.html" ]; then
          cp -r build/* dist/
        fi

        # 4. البحث الذكي المباشر عن index.html في حال تم توليده في مكان فرعي آخر
        if [ ! -f "dist/index.html" ]; then
          FOUND_INDEX=$(find . -maxdepth 4 -name "index.html" -not -path "*/node_modules/*" -not -path "./dist/*" -not -path "./public/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            DIR_PATH=$(dirname "$FOUND_INDEX")
            cp -r "$DIR_PATH"/* dist/
          fi
        fi

        # 5. تغطية احتياطية سريعة للتأكد من توفر index.html
        if [ ! -f "dist/index.html" ] && [ -f "index.html" ]; then
          cp index.html dist/
          [ -d "src" ] && cp -r src dist/ 2>/dev/null || true
          [ -d "public" ] && cp -r public/* dist/ 2>/dev/null || true
        fi

        # 6. إنشاء ملف إعدادات Capacitor المضمون
        node -e "
          const fs = require('fs');
          const config = {
            appId: 'com.salman.ai',
            appName: 'Salman AI',
            webDir: 'dist',
            android: {
              backgroundColor: '#0B0B0B'
            }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
        "

    - name: Add Capacitor Android Platform
      run: npx cap add android || true

    - name: Generate Custom Logo Icon
      run: |
        LOGO_PATH=""
        for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets
          cp "$LOGO_PATH" assets/icon.png
          cp "$LOGO_PATH" assets/icon-only.png
          cp "$LOGO_PATH" assets/icon-foreground.png
          cp "$LOGO_PATH" assets/icon-background.png
          npx --yes @capacitor/assets generate --android || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Installable APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.0.${{ github.run_number }}
        name: Salman AI App v2.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
