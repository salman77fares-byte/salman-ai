name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: |
          npm run build
          mkdir -p dist
          cp -r .output/public/. dist/ || true
          echo "=== DIST FILES ==="
          ls -la dist

      - name: Check Web Assets
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Creating index.html"
            echo '<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
          echo "=== FINAL DIST ==="
          ls -la dist

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.salman.ai",
            "appName": "Salman AI",
            "webDir": "dist"
          }
          EOF

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
