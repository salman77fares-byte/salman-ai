name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: |
          npm run build
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== OUTPUT FILES ==="
          find . -maxdepth 3 -type d \( -name ".output" -o -name "build" -o -name "dist" \)
          echo "=== INDEX FILES ==="
          find . -maxdepth 5 -type f -name "index.html" | grep -v node_modules

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
