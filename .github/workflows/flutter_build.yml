name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --base=./

          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/
          elif [ -d "build" ]; then cp -r build/* www/
          elif [ -d ".output/public" ]; then cp -r .output/public/* www/
          fi

      - name: 🚀 Setup Capacitor Android Shell
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          npx cap init "Salman AI" "com.salman.ai" --web-dir "www"
          npx cap add android

      - name: 🛠️ Grant Permissions & Configure Android
        run: |
          cd android
          chmod +x gradlew
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' app/src/main/AndroidManifest.xml
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' app/src/main/AndroidManifest.xml

      - name: 📱 Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: 📷 Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📦 Upload Release Artifact
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: Salman AI APK v6.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
