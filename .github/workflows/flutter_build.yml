name: Build Perfect Flutter Offline APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js & Build Web App
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🏗️ Compile Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --base=./
          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/
          elif [ -d "build" ]; then cp -r build/* www/
          elif [ -d ".output/public" ]; then cp -r .output/public/* www/
          elif [ -d "dist/client" ]; then cp -r dist/client/* www/
          fi

      - name: ☕ Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 🚀 Create Flutter Shell & Configure
        run: |
          flutter create --org com.salman --project-name ai flutter_app
          cd flutter_app
          
          flutter pub add webview_flutter:4.8.0 connectivity_plus:6.0.5
          flutter pub add --dev flutter_launcher_icons:0.13.1

          mkdir -p assets/www
          cp -r ../www/* assets/www/

          node -e '
          const fs = require("fs");
          const path = require("path");

          function getDirs(dirPath, list = ["assets/www/"]) {
            if (!fs.existsSync(dirPath)) return list;
            const files = fs.readdirSync(dirPath);
            files.forEach((file) => {
              const fullPath = path.join(dirPath, file);
              if (fs.statSync(fullPath).isDirectory()) {
                list.push(fullPath.replace(/\\/g, "/") + "/");
                getDirs(fullPath, list);
              }
            });
            return Array.from(new Set(list));
          }

          const dirs = getDirs("assets/www");
          let pubspec = fs.readFileSync("pubspec.yaml", "utf8");

          const assetLines = "  assets:\n" + dirs.map(d => "    - " + d).join("\n");
          pubspec = pubspec.replace(/^flutter:/m, "flutter:\n" + assetLines);

          fs.writeFileSync("pubspec.yaml", pubspec);
          '

          LOGO_PATH=""
          for p in "../public/logo.png" "../logo.png" "../src/logo.png" "../public/favicon.png"; do
            if [ -f "$p" ]; then
              LOGO_PATH="$p"
              break
            fi
          done

          if [ -n "$LOGO_PATH" ]; then
            mkdir -p assets/icon
            cp "$LOGO_PATH" assets/icon/app_icon.png
            node -e '
            const fs = require("fs");
            let pubspec = fs.readFileSync("pubspec.yaml", "utf8");
            pubspec += "\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  image_path: \"assets/icon/app_icon.png\"\n  min_sdk_android: 21\n";
            fs.writeFileSync("pubspec.yaml", pubspec);
            '
            flutter pub get
            dart run flutter_launcher_icons || true
          fi

      - name: 📝 Inject Fixed WebView Dart Code
        run: |
          cd flutter_app
          node -e '
          const fs = require("fs");
          const code = `import "dart:async";
          import "dart:io";
          import "package:flutter/material.dart";
          import "package:flutter/services.dart";
          import "package:webview_flutter/webview_flutter.dart";
          import "package:connectivity_plus/connectivity_plus.dart";

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(statusBarColor: Colors.transparent, statusBarIconBrightness: Brightness.light),
            );

            int assignedPort = 8080;
            try {
              final server = await HttpServer.bind(InternetAddress.loopbackIPv4, 0);
              assignedPort = server.port;
              
              server.listen((HttpRequest request) async {
                String path = Uri.decodeComponent(request.uri.path);
                if (path == "/" || path.isEmpty) path = "/index.html";
                if (path.startsWith("/")) path = path.substring(1);
                
                String assetPath = "assets/www/" + path;

                ByteData? data;
                try {
                  data = await rootBundle.load(assetPath);
                } catch (_) {
                  try {
                    assetPath = "assets/www/index.html";
                    data = await rootBundle.load(assetPath);
                  } catch (_) {}
                }

                if (data != null) {
                  final bytes = data.buffer.asUint8List();
                  request.response.statusCode = HttpStatus.ok;
                  request.response.headers.set("Access-Control-Allow-Origin", "*");
                  
                  if (assetPath.endsWith(".html")) request.response.headers.contentType = ContentType("text", "html", charset: "utf-8");
                  else if (assetPath.endsWith(".js") || assetPath.endsWith(".mjs")) request.response.headers.contentType = ContentType("application", "javascript", charset: "utf-8");
                  else if (assetPath.endsWith(".css")) request.response.headers.contentType = ContentType("text", "css", charset: "utf-8");
                  else if (assetPath.endsWith(".png")) request.response.headers.contentType = ContentType("image", "png");
                  else if (assetPath.endsWith(".jpg") || assetPath.endsWith(".jpeg")) request.response.headers.contentType = ContentType("image", "jpeg");
                  else if (assetPath.endsWith(".svg")) request.response.headers.contentType = ContentType("image", "svg+xml");
                  else if (assetPath.endsWith(".json")) request.response.headers.contentType = ContentType("application", "json", charset: "utf-8");
                  else if (assetPath.endsWith(".ico")) request.response.headers.contentType = ContentType("image", "x-icon");
                  else if (assetPath.endsWith(".woff2")) request.response.headers.contentType = ContentType("font", "woff2");
                  else if (assetPath.endsWith(".woff")) request.response.headers.contentType = ContentType("font", "woff");
                  
                  request.response.add(bytes);
                } else {
                  request.response.statusCode = HttpStatus.ok;
                  request.response.headers.contentType = ContentType("text", "html", charset: "utf-8");
                  request.response.write("<!DOCTYPE html><html><head><meta charset=\\"utf-8\\"><title>Salman AI</title></head><body style=\\"background:#0b0b0b;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;\\"><h2>جاري تحميل التطبيق...</h2></body></html>");
                }
                await request.response.close();
              });
            } catch (_) {}

            runApp(MyApp(port: assignedPort));
          }

          class MyApp extends StatelessWidget {
            final int port;
            const MyApp({super.key, required this.port});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: "Salman AI",
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: WebViewScreen(port: port),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            final int port;
            const WebViewScreen({super.key, required this.port});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;
            late final StreamSubscription<List<ConnectivityResult>> _connectivitySubscription;
            bool _isOffline = false;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0B0B0B))
                ..loadRequest(Uri.parse("http://127.0.0.1:" + widget.port.toString()));

              Connectivity().checkConnectivity().then((results) => _updateConnectionStatus(results));
              _connectivitySubscription = Connectivity().onConnectivityChanged.listen((results) => _updateConnectionStatus(results));
            }

            void _updateConnectionStatus(List<ConnectivityResult> results) {
              setState(() => _isOffline = results.contains(ConnectivityResult.none) || results.isEmpty);
            }

            @override
            void dispose() {
              _connectivitySubscription.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0B0B0B),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isOffline)
                        Positioned(
                          top: 0, left: 0, right: 0,
                          child: AnimatedContainer(
                            duration: const Duration(milliseconds: 300),
                            padding: const EdgeInsets.symmetric(vertical: 7, horizontal: 12),
                            color: const Color(0xDCB00020),
                            child: const Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.wifi_off_rounded, color: Colors.white, size: 16),
                                SizedBox(width: 8),
                                Text("لا يوجد اتصال بالإنترنت - الوضع أوفلاين", style: TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }`;
          fs.writeFileSync("lib/main.dart", code);
          '

      - name: 🛠️ Force Correct App Name & Configurations
        run: |
          cd flutter_app
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/g' android/app/src/main/AndroidManifest.xml

          node -e '
          const fs = require("fs");
          const stringsPath = "android/app/src/main/res/values/strings.xml";
          let xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">Salman AI</string>\n</resources>";
          fs.writeFileSync(stringsPath, xml, "utf8");
          '

          node -e '
          const fs = require("fs");
          const buildGradlePath = "android/app/build.gradle";
          if (fs.existsSync(buildGradlePath)) {
            let content = fs.readFileSync(buildGradlePath, "utf8");
            content = content.replace(/ndkVersion\s*=\s*.*/g, "");
            content = content.replace(/flutter\.compileSdkVersion/g, "34");
            content = content.replace(/flutter\.minSdkVersion/g, "21");
            content = content.replace(/flutter\.targetSdkVersion/g, "34");
            fs.writeFileSync(buildGradlePath, content, "utf8");
          }
          '

      - name: 🚀 Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: 📦 Upload Release Artifact
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v4.6.${{ github.run_number }}
          name: Salman AI Final App v4.6.${{ github.run_number }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
