name: Build and Publish Salman AI APK to Releases

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      - name: Prepare Dummy Web Directory
        run: |
          mkdir -p dist
          echo '<html><body>Salman AI</body></html>' > dist/index.html

      - name: Sync Capacitor Shell & Set Direct Web URL
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          
          # توجيه التطبيق لفتح الموقع مباشرة بدون أي تأخير أو صفحات وسيطة
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.salman.ai",
            "appName": "Salman AI",
            "webDir": "dist",
            "server": {
              "url": "https://salman-ai.lovable.app",
              "cleartext": true,
              "allowNavigation": [
                "salman-ai.lovable.app",
                "*.lovable.app",
                "*.supabase.co"
              ]
            }
          }
          EOF
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Process Logo & Apply Icon Padding
        run: |
          # تثبيت مكتبة Pillow للتعامل مع الصور
          python3 -m pip install Pillow

          # البحث عن صورة الشعار وإضافة هامش داخلي (Padding) لتظهر أيقونة متناسقة
          python3 -c "
          from PIL import Image
          import os, glob

          def find_logo():
              for root, dirs, files in os.walk('.'):
                  if 'node_modules' in root or 'android' in root or '.git' in root:
                      continue
                  for f in files:
                      if f.lower() == 'logo.png':
                          return os.path.join(root, f)
              return None

          logo_path = find_logo()
          if logo_path:
              print('Found logo at:', logo_path)
              img = Image.open(logo_path).convert('RGBA')
              w, h = img.size
              pad = int(max(w, h) * 0.22)
              new_img = Image.new('RGBA', (w + pad * 2, h + pad * 2), (0, 0, 0, 0))
              new_img.paste(img, (pad, pad), img)
              new_img.save('logo_padded.png')
              
              res_dir = 'android/app/src/main/res'
              if os.path.exists(res_dir):
                  for root, dirs, files in os.walk(res_dir):
                      folder = os.path.basename(root)
                      if folder.startswith('mipmap') or folder.startswith('drawable'):
                          for f in files:
                              ext = os.path.splitext(f)[1].lower()
                              if f.startswith('ic_launcher') and ext in ['.png', '.webp']:
                                  target = os.path.join(root, f)
                                  img_scaled = new_img.resize(Image.open(target).size, Image.Resampling.LANCZOS)
                                  img_scaled.save(target)
                  print('Successfully updated app launcher icons with balanced padding.')
          "

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' "$MANIFEST"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | tail -n 1)
          
          "$BUILD_TOOLS_DIR/zipalign" -v 4 "$RAW_APK" output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk

      - name: 📦 Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Salman AI Release v1.0.${{ github.run_number }}"
          body: |
            📱 **تطبيق Salman AI - التحديث النهائي**
            
            - **سرعة الفتح**: تحويل مباشر وسريع جداً للموقع فور تشغيل التطبيق.
            - **تحسين الأيقونة**: ضبط الهامش الشفاف للشعار لتنسيق شكله على الواجهة الرئيسية.
          draft: false
          prerelease: false
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
