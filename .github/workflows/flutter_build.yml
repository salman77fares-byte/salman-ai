name: Build Salman AI Official APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Auto-Generate Missing Root index.html
        run: |
          if [ ! -f "index.html" ]; then
            echo "Creating missing index.html for React/Vite..."
            
            ENTRY_FILE=""
            if [ -f "src/main.tsx" ]; then ENTRY_FILE="/src/main.tsx";
            elif [ -f "src/main.jsx" ]; then ENTRY_FILE="/src/main.jsx";
            elif [ -f "src/index.tsx" ]; then ENTRY_FILE="/src/index.tsx";
            elif [ -f "src/index.jsx" ]; then ENTRY_FILE="/src/index.jsx";
            fi

            cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Salman AI</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="${ENTRY_FILE}"></script>
            </body>
          </html>
          EOF
          fi

      - name: 📦 Build Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --base=./ || true

          mkdir -p www
          
          if [ -d "dist" ]; then cp -r dist/* www/ ; fi
          if [ -d "build" ]; then cp -r build/* www/ ; fi
          if [ -d ".output/public" ]; then cp -r .output/public/* www/ ; fi

          # Ensure index.html exists in www
          if [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi

      - name: 🚀 Setup Capacitor Android Shell
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          npx cap init "Salman AI" "com.salman.ai" --web-dir "www"
          npx cap add android

      - name: 🛠️ Fix Kotlin Duplicate Class & Set Android Specs
        run: |
          cd android

          node -e '
          const fs = require("fs");
          const p = "build.gradle";
          if (fs.existsSync(p)) {
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes("resolutionStrategy")) {
              content += `\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        }\n    }\n}\n`;
              fs.writeFileSync(p, content);
            }
          }
          '

          chmod +x gradlew
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' app/src/main/AndroidManifest.xml
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' app/src/main/AndroidManifest.xml

      - name: 📱 Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: 🏗️ Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📦 Upload Release Artifact
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v7.2.${{ github.run_number }}
          name: Salman AI Official APK v7.2.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
