
name: Build Salman AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - v1
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter_build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name salman_ai .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build optimized release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK files
        run: |
          ls -lh build/app/outputs/flutter-apk/*-release.apk
          test -n "$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*-release.apk' -print -quit)"

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-Release-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 7
