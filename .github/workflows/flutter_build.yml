name: Build Complete Offline Flutter APK (Blackscreen Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js & Build Static Assets
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Build Web Application
      run: |
        npm install --legacy-peer-deps
        npm run build || npx vite build --base=./

        mkdir -p www
        if [ -d ".output/public" ]; then
          cp -r .output/public/* www/
        elif [ -d "dist/client" ]; then
          cp -r dist/client/* www/
        elif [ -d "dist" ]; then
          cp -r dist/* www/
        elif [ -d "build" ]; then
          cp -r build/* www/
        fi

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: Build Native Flutter Shell with Connectivity Banner & Network Fix
      run: |
        # 1. إنشاء تطبيق Flutter
        flutter create --org com.salman --project-name ai flutter_app
        cd flutter_app

        # 2. إضافة المكتبات
        flutter pub add webview_flutter
        flutter pub add connectivity_plus
        flutter pub add --dev flutter_launcher_icons

        # 3. تجهيز ملفات Web
        mkdir -p assets/www
        cp -r ../www/* assets/www/

        # 4. معالجة الشعار
        LOGO_PATH=""
        for p in "../public/logo.png" "../logo.png" "../src/logo.png" "../public/favicon.png"; do
          if [ -f "$p" ]; then
            LOGO_PATH="$p"
            break
          fi
        done

        if [ -n "$LOGO_PATH" ]; then
          mkdir -p assets/icon
          cp "$LOGO_PATH" assets/icon/app_icon.png
          cat << 'EOF' >> pubspec.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
EOF
        fi

        # 5. تسجيل كافة المجلدات والملفات في pubspec.yaml
        node -e "
          const fs = require('fs');
          let yaml = fs.readFileSync('pubspec.yaml', 'utf8');
          if (!yaml.includes('assets:')) {
            yaml += '\n  assets:\n';
          }
          yaml += '    - assets/www/\n';
          
          const getDirs = (dir) => {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const filePath = dir + '/' + file;
              const stat = fs.statSync(filePath);
              if (stat && stat.isDirectory()) {
                results.push(filePath + '/');
                results = results.concat(getDirs(filePath));
              }
            });
            return results;
          };
          
          if (fs.existsSync('assets/www')) {
            getDirs('assets/www').forEach(d => {
              yaml += '    - ' + d + '\n';
            });
          }
          fs.writeFileSync('pubspec.yaml', yaml);
        "

        # 6. كتابة كود التطبيق المطور لمعالجة الاتصال والملفات المحلية
        cat << 'EOF' > lib/main.dart
        import 'dart:async';
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:flutter/services.dart';
        import 'package:webview_flutter/webview_flutter.dart';
        import 'package:connectivity_plus/connectivity_plus.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          SystemChrome.setSystemUIOverlayStyle(
            const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
            ),
          );

          // تشغيل الخادم المحلي
          try {
            final server = await HttpServer.bind(InternetAddress.loopbackIPv4, 8080);
            server.listen((HttpRequest request) async {
              String path = request.uri.path;
              if (path == '/') path = '/index.html';
              final assetPath = 'assets/www$path';
              try {
                final data = await rootBundle.load(assetPath);
                final bytes = data.buffer.asUint8List();
                
                if (path.endsWith('.html')) request.response.headers.contentType = ContentType.html;
                else if (path.endsWith('.js') || path.endsWith('.mjs')) request.response.headers.contentType = ContentType('application', 'javascript', charset: 'utf-8');
                else if (path.endsWith('.css')) request.response.headers.contentType = ContentType('text', 'css', charset: 'utf-8');
                else if (path.endsWith('.png')) request.response.headers.contentType = ContentType('image', 'png');
                else if (path.endsWith('.svg')) request.response.headers.contentType = ContentType('image', 'svg+xml');
                else if (path.endsWith('.json')) request.response.headers.contentType = ContentType.json;
                
                request.response.add(bytes);
              } catch (e) {
                try {
                  final data = await rootBundle.load('assets/www/index.html');
                  request.response.headers.contentType = ContentType.html;
                  request.response.add(data.buffer.asUint8List());
                } catch (_) {
                  request.response.statusCode = HttpStatus.notFound;
                }
              }
              await request.response.close();
            });
          } catch (_) {}

          runApp(const MyApp());
        }

        class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'Salman AI',
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark(),
              home: const WebViewScreen(),
            );
          }
        }

        class WebViewScreen extends StatefulWidget {
          const WebViewScreen({super.key});

          @override
          State<WebViewScreen> createState() => _WebViewScreenState();
        }

        class _WebViewScreenState extends State<WebViewScreen> {
          late final WebViewController _controller;
          late final StreamSubscription<List<ConnectivityResult>> _connectivitySubscription;
          bool _isOffline = false;

          @override
          void initState() {
            super.initState();
            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..setBackgroundColor(const Color(0xFF0B0B0B))
              ..loadRequest(Uri.parse('http://127.0.0.1:8080'));

            _connectivitySubscription = Connectivity().onConnectivityChanged.listen((results) {
              final isDisconnected = results.contains(ConnectivityResult.none) || results.isEmpty;
              setState(() {
                _isOffline = isDisconnected;
              });
            });
          }

          @override
          void dispose() {
            _connectivitySubscription.cancel();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFF0B0B0B),
              body: SafeArea(
                child: Stack(
                  children: [
                    WebViewWidget(controller: _controller),
                    if (_isOffline)
                      Positioned(
                        top: 0,
                        left: 0,
                        right: 0,
                        child: AnimatedContainer(
                          duration: const Duration(milliseconds: 300),
                          padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 12),
                          color: const Color(0xDCB00020),
                          child: const Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.wifi_off_rounded, color: Colors.white, size: 16),
                              SizedBox(width: 8),
                              Text(
                                'لا يوجد اتصال بالإنترنت - الوضع أوفلاين',
                                style: TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold),
                              ),
                            ],
                          ),
                        ),
                      ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

        # 7. تطبيق الأيقونة وتفعيل Cleartext Traffic لإلغاء الشاشة السوداء في أندرويد
        flutter pub get
        if [ -n "$LOGO_PATH" ]; then
          dart run flutter_launcher_icons || true
        fi

        # تفعيل السماح بالاتصالات المحلية وتعديل اسم التطبيق
        sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="ai"/android:label="Salman AI"/g' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

    - name: Build Android Release APK
      run: |
        cd flutter_app
        flutter build apk --release

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v3.1.${{ github.run_number }}
        name: Salman AI Fixed Offline App v3.1.${{ github.run_number }}
        files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
