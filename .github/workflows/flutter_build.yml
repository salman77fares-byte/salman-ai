name: Build Salman AI Official Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Build Web & Guarantee index.html
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --base=./ || true

          rm -rf www
          mkdir -p www

          if [ -d ".output/public" ]; then cp -r .output/public/* www/ ; fi
          if [ -d "dist" ]; then cp -r dist/* www/ ; fi
          if [ -d "build" ]; then cp -r build/* www/ ; fi
          if [ -d "out" ]; then cp -r out/* www/ ; fi

          NESTED_INDEX=$(find www -name "index.html" | head -n 1)
          if [ -n "$NESTED_INDEX" ] && [ "$NESTED_INDEX" != "www/index.html" ]; then
            PARENT_DIR=$(dirname "$NESTED_INDEX")
            cp -r $PARENT_DIR/* www/
          fi

          if [ ! -f "www/index.html" ]; then
            cat <<EOF > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Salman AI</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi

      - name: 🚀 Setup Capacitor Shell & Add Android
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/network@5.0.7 --save-dev
          npx cap init "Salman AI" "com.salman.ai" --web-dir "www"
          npx cap add android

      - name: 🖼️ Process & Pad App Logo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          LOGO_PATH=""
          for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png" "public/icon.png"; do
            if [ -f "$p" ]; then
              LOGO_PATH="$p"
              break
            fi
          done

          if [ -n "$LOGO_PATH" ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi

            convert "$LOGO_PATH" -resize 36x36 -gravity center -background none -extent 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO_PATH" -resize 54x54 -gravity center -background none -extent 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO_PATH" -resize 72x72 -gravity center -background none -extent 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO_PATH" -resize 108x108 -gravity center -background none -extent 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO_PATH" -resize 144x144 -gravity center -background none -extent 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            # Target only valid image directories to avoid XML folder errors
            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-$DPI"
              if [ -f "$DIR/ic_launcher.png" ]; then
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: 🛠️ Configure Android Permissions & Network Specs
        run: |
          cd android

          node -e '
          const fs = require("fs");
          const p = "build.gradle";
          if (fs.existsSync(p)) {
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes("resolutionStrategy")) {
              content += `\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        }\n    }\n}\n`;
              fs.writeFileSync(p, content);
            }
          }
          '

          chmod +x gradlew
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' app/src/main/AndroidManifest.xml
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' app/src/main/AndroidManifest.xml

      - name: 📱 Sync Native Assets
        run: npx cap sync android

      - name: 🏗️ Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 🔑 Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 $RAW_APK output_apk/Salman_AI.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman_AI.apk

      - name: 📦 Upload Final APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v16.0.${{ github.run_number }}
          name: Salman AI Final APK v16.0.${{ github.run_number }}
          files: output_apk/Salman_AI.apk
