name: Build Salman AI Full Hybrid APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build || true

      - name: Construct Complete UI Bundle (Eliminate White Screen)
        run: |
          rm -rf www
          mkdir -p www/assets

          # 1. نسخ كافة الأصول الناتجة عن البناء إلى مجلد www
          for dir in dist .output/public build out; do
            if [ -d "$dir" ]; then
              cp -r $dir/* www/ 2>/dev/null || true
            fi
          done

          # 2. نسخ الشعار المتاح لاستخدامه في الواجهة
          LOGO_SRC=""
          for p in "public/logo.png" "public/icon-512.png" "logo.png" "src/logo.png"; do
            if [ -f "$p" ]; then LOGO_SRC="$p"; break; fi
          done
          if [ -n "$LOGO_SRC" ]; then cp "$LOGO_SRC" www/logo.png; fi

          # 3. إنتاج ملف index.html غني بالتنسيقات والواجهة الحقيقية المضمنة
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Salman AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              body, html { width: 100%; height: 100%; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
              #app-header { height: 60px; background-color: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #334155; }
              .brand { display: flex; align-items: center; gap: 10px; }
              .brand img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
              .brand span { font-weight: bold; font-size: 18px; color: #10b981; }
              .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
              .online { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
              .offline { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
              #frame-container { width: 100%; height: calc(100% - 60px); position: relative; }
              iframe { width: 100%; height: 100%; border: none; background-color: #0f172a; }
              #offline-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
              #offline-overlay img { width: 80px; height: 80px; border-radius: 16px; margin-bottom: 16px; }
              #offline-overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 8px; }
              #offline-overlay p { font-size: 14px; color: #94a3b8; max-width: 320px; line-height: 1.5; }
            </style>
          </head>
          <body>
            <div id="app-header">
              <div class="brand">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
                <span>Salman AI</span>
              </div>
              <div id="network-status" class="status-badge online">متصل</div>
            </div>

            <div id="frame-container">
              <iframe id="main-frame" src="https://salman-ai.lovable.app"></iframe>
              <div id="offline-overlay">
                <img src="logo.png" alt="Salman AI Logo" onerror="this.style.display='none'">
                <h2>Salman AI</h2>
                <p>الواجهة متاحة حالياً بدون إنترنت.<br>يرجى التوصيل بالشبكة لاستكمال الاستجابة للخدمات والتفاعل المباشر.</p>
              </div>
            </div>

            <script>
              const iframe = document.getElementById('main-frame');
              const statusBadge = document.getElementById('network-status');
              const offlineOverlay = document.getElementById('offline-overlay');

              function updateStatus() {
                if (navigator.onLine) {
                  statusBadge.innerText = 'متصل';
                  statusBadge.className = 'status-badge online';
                  offlineOverlay.style.display = 'none';
                  iframe.style.display = 'block';
                } else {
                  statusBadge.innerText = 'غير متصل';
                  statusBadge.className = 'status-badge offline';
                  offlineOverlay.style.display = 'flex';
                  iframe.style.display = 'none';
                }
              }

              window.addEventListener('online', updateStatus);
              window.addEventListener('offline', updateStatus);
              window.addEventListener('load', updateStatus);
            </script>
          </body>
          </html>
          EOF

      - name: Setup Capacitor Shell
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          echo '{"appId":"com.salman.ai","appName":"Salman AI","webDir":"www","server":{"androidScheme":"https","hostname":"localhost","cleartext":true}}' > capacitor.config.json
          npx cap add android || true

      - name: Apply Custom Logo (Android App Icons)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          LOGO=""
          for p in "public/logo.png" "public/icon-512.png" "logo.png" "src/logo.png"; do
            if [ -f "$p" ]; then LOGO="$p"; break; fi
          done

          if [ -n "$LOGO" ]; then
            echo "Applying logo from $LOGO"
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            
            convert "$LOGO" -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO" -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO" -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO" -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO" -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-$DPI"
              if [ -d "$DIR" ]; then
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png" || true
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: Configure Android Permissions & Sync
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 $RAW_APK output_apk/Salman_AI.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman_AI.apk

      - name: Upload Final Signed APK to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v33.0.${{ github.run_number }}
          name: Salman AI Official Release v33.0.${{ github.run_number }}
          files: output_apk/Salman_AI.apk
