name: Build and Publish Salman AI APK to Releases

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      - name: Generate In-App Web Launcher
        run: |
          mkdir -p dist
          
          # إنشاء صفحة الويب الذكية
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Salman AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background-color: #0b0f19;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                padding: 24px;
                text-align: center;
              }
              .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                max-width: 360px;
                width: 100%;
              }
              .logo-box {
                width: 100px;
                height: 100px;
                border-radius: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 24px;
                overflow: hidden;
                box-shadow: 0 8px 24px rgba(0,0,0,0.5);
              }
              .logo-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 24px;
              }
              h1 {
                font-size: 28px;
                font-weight: 700;
                margin-bottom: 12px;
                color: #ffffff;
              }
              p {
                font-size: 16px;
                color: #94a3b8;
                margin-bottom: 32px;
                line-height: 1.6;
              }
              .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background: rgba(239, 68, 68, 0.15);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #f87171;
                border-radius: 20px;
                font-size: 14px;
                margin-bottom: 24px;
              }
              .status-dot {
                width: 8px;
                height: 8px;
                background-color: #ef4444;
                border-radius: 50%;
              }
              .btn-retry {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #ffffff;
                border: none;
                padding: 14px 32px;
                font-size: 16px;
                font-weight: 600;
                border-radius: 14px;
                cursor: pointer;
                width: 100%;
                box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
              }
              .loader {
                display: none;
                width: 24px;
                height: 24px;
                border: 3px solid rgba(255,255,255,0.3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s linear infinite;
                margin: 0 auto;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="logo-box">
                <img id="app-logo" src="" alt="Salman AI Logo">
              </div>

              <h1>Salman AI</h1>
              
              <div class="status-badge">
                <span class="status-dot"></span>
                <span>لا يوجد اتصال بالشبكة</span>
              </div>

              <p>يرجى الاتصال بالإنترنت لفتح التطبيق واستخدامه.</p>

              <button class="btn-retry" onclick="checkConnection()">
                <span id="btn-text">إعادة المحاولة</span>
                <div class="loader" id="btn-loader"></div>
              </button>
            </div>

            <script>
              const APP_URL = "https://salman-ai.lovable.app";

              function checkConnection() {
                const btnText = document.getElementById('btn-text');
                const btnLoader = document.getElementById('btn-loader');
                
                if (btnText && btnLoader) {
                  btnText.style.display = 'none';
                  btnLoader.style.display = 'block';
                }

                if (navigator.onLine) {
                  window.location.replace(APP_URL);
                } else {
                  setTimeout(() => {
                    if (btnText && btnLoader) {
                      btnText.style.display = 'inline';
                      btnLoader.style.display = 'none';
                    }
                  }, 800);
                }
              }

              window.addEventListener('online', () => {
                window.location.replace(APP_URL);
              });

              if (navigator.onLine) {
                window.location.replace(APP_URL);
              }
            </script>
          </body>
          </html>
          EOF

          # معالجة الشعار وتضمينه بأمان باستخدام Node.js لمنع خطأ Argument list too long
          node -e "
          const fs = require('fs');
          const path = require('path');

          function findFile(dir, fileName) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              if (file === 'node_modules' || file === 'android' || file === '.git') continue;
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                const found = findFile(fullPath, fileName);
                if (found) return found;
              } else if (file.toLowerCase() === fileName.toLowerCase()) {
                return fullPath;
              }
            }
            return null;
          }

          const logoPath = findFile('.', 'logo.png');
          let html = fs.readFileSync('dist/index.html', 'utf8');

          if (logoPath) {
            console.log('Logo found at:', logoPath);
            const b64 = fs.readFileSync(logoPath).toString('base64');
            html = html.replace('src=\"\"', 'src=\"data:image/png;base64,' + b64 + '\"');
          } else {
            console.log('Logo not found, using fallback icon');
          }
          fs.writeFileSync('dist/index.html', html);
          "

      - name: Sync Capacitor Shell & Configure In-App Navigation
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.salman.ai",
            "appName": "Salman AI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "salman-ai.lovable.app",
                "*.lovable.app",
                "*.supabase.co"
              ]
            }
          }
          EOF
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # استبدال أيقونات الأندرويد بشعار التطبيق
          node -e "
          const fs = require('fs');
          const path = require('path');

          function findFile(dir, fileName) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              if (file === 'node_modules' || file === 'android' || file === '.git') continue;
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                const found = findFile(fullPath, fileName);
                if (found) return found;
              } else if (file.toLowerCase() === fileName.toLowerCase()) {
                return fullPath;
              }
            }
            return null;
          }

          const logoPath = findFile('.', 'logo.png');
          if (logoPath && fs.existsSync('android/app/src/main/res')) {
            const resDir = 'android/app/src/main/res';
            const folders = fs.readdirSync(resDir);
            for (const folder of folders) {
              if (folder.startsWith('mipmap')) {
                const targetPath = path.join(resDir, folder);
                const files = fs.readdirSync(targetPath);
                for (const f of files) {
                  if (f.startsWith('ic_launcher')) {
                    fs.copyFileSync(logoPath, path.join(targetPath, f));
                  }
                }
              }
            }
            console.log('Successfully updated Android launcher icons.');
          }
          "

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' "$MANIFEST"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | tail -n 1)
          
          "$BUILD_TOOLS_DIR/zipalign" -v 4 "$RAW_APK" output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk

      - name: 📦 Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Salman AI Release v1.0.${{ github.run_number }}"
          body: |
            📱 **تطبيق Salman AI - إصدار APK مصلح بالكامل**
            
            - تم التصفح الداخلي كاملاً دون الحاجة لمتصفح Chrome.
            - تم دمج الشعار الرسمي في شاشة عدم الاتصال وأيقونة التطبيق.
          draft: false
          prerelease: false
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
