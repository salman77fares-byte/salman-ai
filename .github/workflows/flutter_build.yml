name: Build Salman AI Dual-Interface APK

on:
  push:
    branches: [ "main", "master", "v1", "v*" ]
  pull_request:
    branches: [ "main", "master", "v1" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Dual-Interface APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps || npm install --force

      - name: Build Web Assets & Inject Dual-Interface Engine
        run: |
          # 1. تجميع الويب الحقيقي
          npm run build || npx vite build --base=./ || true
          
          # تحديد مجلد المخرجات
          OUT_DIR="dist"
          if [ -d ".output/public" ]; then OUT_DIR=".output/public";
          elif [ -d "build" ]; then OUT_DIR="build";
          elif [ -d "www" ]; then OUT_DIR="www";
          fi

          mkdir -p www
          cp -r $OUT_DIR/* www/ || true

          # 2. البحث عن شعار التطبيق
          LOGO_SRC="logo.png"
          for p in "public/logo.png" "public/icon.png" "src/logo.png" "logo.png"; do
            if [ -f "$p" ]; then LOGO_SRC="$p"; break; fi
          done
          if [ -f "$LOGO_SRC" ]; then cp "$LOGO_SRC" www/app-logo.png; fi

          # 3. إعادة كتابة index.html لنظام الواجهتين المتكامل
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>Salman AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
              body, html { width: 100%; height: 100%; background-color: #0b0b0b; color: #ffffff; overflow: hidden; }

              /* الواجهة الأولى: الأوفلاين */
              #offline-interface {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: radial-gradient(circle at center, #1a1a2e 0%, #0b0b0b 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                text-align: center;
                z-index: 9999;
                transition: opacity 0.4s ease, visibility 0.4s ease;
              }

              .logo-container {
                width: 110px; height: 110px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 24px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
              }

              .logo-container img { width: 75px; height: 75px; object-fit: contain; }

              .offline-title {
                font-size: 20px;
                font-weight: 700;
                color: #ffffff;
                margin-bottom: 8px;
              }

              .offline-desc {
                font-size: 14px;
                color: #a0a0a0;
                margin-bottom: 28px;
                max-width: 280px;
                line-height: 1.5;
              }

              .retry-btn {
                background: #6366f1;
                color: #ffffff;
                border: none;
                padding: 12px 28px;
                font-size: 14px;
                font-weight: 600;
                border-radius: 12px;
                cursor: pointer;
                box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
                transition: transform 0.2s;
              }
              .retry-btn:active { transform: scale(0.95); }

              /* الواجهة الثانية: تطبيق الأونلاين الحقيقي */
              #online-interface {
                width: 100%; height: 100%;
                display: none;
              }

              /* حالة الإخفاء للواجهة الأولى */
              .hidden { opacity: 0; visibility: hidden; pointer-events: none; }
            </style>
          </head>
          <body>

            <!-- الواجهة 1: واجهة الأوفلاين -->
            <div id="offline-interface">
              <div class="logo-container">
                <img src="app-logo.png" alt="Salman AI Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236366f1\'><path d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/></svg>'" />
              </div>
              <div class="offline-title">لا يوجد اتصال بالإنترنت</div>
              <div class="offline-desc">يرجى الاتصال بالشبكة للوصول إلى كافة مميزات وخدمات تطبيق Salman AI</div>
              <button class="retry-btn" onclick="checkConnection()">إعادة المحاولة</button>
            </div>

            <!-- الواجهة 2: تطبيق الأونلاين -->
            <div id="online-interface">
              <div id="root"></div>
            </div>

            <script>
              const offlineUI = document.getElementById('offline-interface');
              const onlineUI = document.getElementById('online-interface');

              function showOnline() {
                offlineUI.classList.add('hidden');
                onlineUI.style.display = 'block';
              }

              function showOffline() {
                offlineUI.classList.remove('hidden');
                onlineUI.style.display = 'none';
              }

              async function checkConnection() {
                if (!navigator.onLine) {
                  showOffline();
                  return;
                }
                
                try {
                  // فحص أعمق للإنترنت للتأكد من وصول الخدمة
                  const res = await fetch('https://httpbin.org/ping', { method: 'HEAD', cache: 'no-store', mode: 'no-cors' });
                  showOnline();
                } catch (e) {
                  // في حال الاتصال بشركة المحمول/الواي فاي بدون إنترنت حقيقي
                  if (navigator.onLine) {
                    showOnline(); 
                  } else {
                    showOffline();
                  }
                }
              }

              // الاستماع الفوري لإنعاش وتغير الشبكة
              window.addEventListener('online', checkConnection);
              window.addEventListener('offline', showOffline);

              // الفحص الابتدائي فور تشغيل التطبيق
              checkConnection();
            </script>
          </body>
          </html>
          EOF

      - name: Sync Capacitor Shell
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          echo '{"appId":"com.salman.ai","appName":"Salman AI","webDir":"www","server":{"androidScheme":"https","cleartext":true}}' > capacitor.config.json
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' "$MANIFEST"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 $RAW_APK output_apk/Salman-AI-Signed.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman-AI-Signed.apk

      - name: Upload Dual-Interface Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-DualInterface-APK
          path: output_apk/Salman-AI-Signed.apk
          retention-days: 30
