name: Build and Publish Salman AI APK to Releases

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      - name: Build Web Application & Offline Launcher
        env:
          CI: false
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          # 1. إزالة الموديلات المعطلة محلياً لتهيئة بيئة البناء
          node -e "
          const fs = require('fs');
          ['vite.config.ts', 'vite.config.js', 'vite.config.mts'].forEach(file => {
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, 'utf8');
              content = content.replace(/import.*lovable-tagger.*/g, 'const componentTagger = () => null;');
              content = content.replace(/import.*@lovable\.dev.*/g, '');
              fs.writeFileSync(file, content);
            }
          });
          "

          # 2. محاولة بناء التطبيق المحلي
          npx vite build --base=./ || true

          # 3. التأكد من تحويل مجلد build إلى dist إن وجد
          if [ ! -d "dist" ] && [ -d "build" ]; then
            mkdir -p dist
            cp -r build/* dist/
          fi

          # 4. تجهيز واجهة WebView الذكية المزودة بفاحص الاتصال بالإنترنت
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Salman AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background-color: #0b0f19;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                padding: 24px;
                text-align: center;
              }
              .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                max-width: 360px;
                width: 100%;
              }
              .logo-box {
                width: 96px;
                height: 96px;
                border-radius: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 24px;
                overflow: hidden;
              }
              .logo-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 24px;
              }
              h1 {
                font-size: 28px;
                font-weight: 700;
                margin-bottom: 12px;
                background: linear-gradient(to right, #60a5fa, #c084fc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              p {
                font-size: 16px;
                color: #94a3b8;
                margin-bottom: 32px;
                line-height: 1.6;
              }
              .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background: rgba(239, 68, 68, 0.1);
                border: 1px solid rgba(239, 68, 68, 0.2);
                color: #f87171;
                border-radius: 20px;
                font-size: 14px;
                margin-bottom: 24px;
              }
              .status-dot {
                width: 8px;
                height: 8px;
                background-color: #ef4444;
                border-radius: 50%;
              }
              .btn-retry {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #ffffff;
                border: none;
                padding: 14px 32px;
                font-size: 16px;
                font-weight: 600;
                border-radius: 14px;
                cursor: pointer;
                width: 100%;
                box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
                transition: transform 0.2s, background 0.2s;
              }
              .btn-retry:active {
                transform: scale(0.97);
              }
              .loader {
                display: none;
                width: 24px;
                height: 24px;
                border: 3px solid rgba(255,255,255,0.3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s linear infinite;
                margin: 0 auto;
              }
              @keyframes spin {
                to { transform: rotate(360deg); }
              }
            </style>
          </head>
          <body>

            <div class="container" id="offline-screen">
              <div class="logo-box">
                <img src="logo.png" alt="Salman AI Logo" onerror="this.outerHTML='<svg viewBox=\'0 0 24 24\' width=\'48\' height=\'48\' fill=\'white\'><path d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z\'/></svg>'">
              </div>

              <h1>Salman AI</h1>
              
              <div class="status-badge">
                <span class="status-dot"></span>
                <span>لا يوجد اتصال بالشبكة</span>
              </div>

              <p>يرجى الاتصال بالإنترنت لفتح التطبيق واستخدامه.</p>

              <button class="btn-retry" onclick="checkConnection()">
                <span id="btn-text">إعادة المحاولة</span>
                <div class="loader" id="btn-loader"></div>
              </button>
            </div>

            <script>
              const APP_URL = "https://salman-ai.lovable.app";

              function checkConnection() {
                const btnText = document.getElementById('btn-text');
                const btnLoader = document.getElementById('btn-loader');
                
                btnText.style.display = 'none';
                btnLoader.style.display = 'block';

                if (navigator.onLine) {
                  fetch(APP_URL, { mode: 'no-cors', cache: 'no-store' })
                    .then(() => {
                      window.location.replace(APP_URL);
                    })
                    .catch(() => {
                      setTimeout(() => {
                        window.location.replace(APP_URL);
                      }, 500);
                    });
                } else {
                  setTimeout(() => {
                    btnText.style.display = 'inline';
                    btnLoader.style.display = 'none';
                  }, 800);
                }
              }

              window.addEventListener('online', () => {
                checkConnection();
              });

              if (navigator.onLine) {
                checkConnection();
              }
            </script>
          </body>
          </html>
          EOF

      - name: Sync Capacitor Shell & Update App Icon
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.salman.ai",
            "appName": "Salman AI",
            "webDir": "dist",
            "allowNavigation": [
              "salman-ai.lovable.app",
              "*.lovable.app",
              "*.supabase.co"
            ],
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # استبدال أيقونات الأندرويد باللوجو الحقيقي logo.png
          LOGO_FILE=$(find . -not -path "*/node_modules/*" -not -path "*/android/*" -name "logo.png" | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            echo "Found logo at $LOGO_FILE. Updating Android icons..."
            cp "$LOGO_FILE" dist/logo.png || true
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp "$LOGO_FILE" {} \;
            find android/app/src/main/res/ -name "ic_launcher*.webp" -exec cp "$LOGO_FILE" {} \;
          else
            echo "Warning: logo.png not found in repository!"
          fi

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' "$MANIFEST"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | tail -n 1)
          
          "$BUILD_TOOLS_DIR/zipalign" -v 4 "$RAW_APK" output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman-AI-v1.0.${{ github.run_number }}.apk

      - name: 📦 Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Salman AI Release v1.0.${{ github.run_number }}"
          body: |
            📱 **تطبيق Salman AI - إصدار APK جاهز بالشعار الرسمي**
            
            - تم تحديث الشعار الرسمي للتطبيق تلقائياً عبر `logo.png`.
            - واجهة أوفلاين تفاعلية تدعم الاتصال التلقائي بالإنترنت.
          draft: false
          prerelease: false
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
