name: Build Salman AI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare npm
        run: |
          echo "Removing old package-lock.json..."
          rm -f package-lock.json

          echo "Cleaning npm cache..."
          npm cache clean --force

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install required UI dependencies explicitly
        run: |
          npm install \
            @radix-ui/react-switch@1.3.7 \
            @streamdown/math@1.0.2 \
            @streamdown/mermaid@1.0.2 \
            --save \
            --legacy-peer-deps

      - name: Verify required dependencies
        run: |
          echo "Checking required dependencies..."

          if [ ! -d "node_modules/@radix-ui/react-switch" ]; then
            echo "ERROR: @radix-ui/react-switch is missing."
            exit 1
          fi

          if [ ! -d "node_modules/@streamdown/math" ]; then
            echo "ERROR: @streamdown/math is missing."
            exit 1
          fi

          if [ ! -d "node_modules/@streamdown/mermaid" ]; then
            echo "ERROR: @streamdown/mermaid is missing."
            exit 1
          fi

          echo "All required dependencies are installed successfully."

      - name: Show installed dependency versions
        run: |
          echo "Installed Radix Switch:"
          npm list @radix-ui/react-switch --depth=0 || true

          echo "Installed Streamdown Math:"
          npm list @streamdown/math --depth=0 || true

          echo "Installed Streamdown Mermaid:"
          npm list @streamdown/mermaid --depth=0 || true

      - name: Build web application
        run: |
          npm run build

      - name: Locate and prepare web build
        run: |
          echo "Searching for build output..."

          echo ""
          echo "Top-level directories:"
          find . -maxdepth 2 -type d \
            ! -path "./node_modules*" \
            ! -path "./.git*" \
            | sort

          echo ""
          echo "Searching for index.html files:"
          find . -type f -name "index.html" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Searching common TanStack build directories..."

          if [ -f ".output/public/index.html" ]; then
            echo "Found: .output/public/index.html"

            rm -rf dist
            mkdir -p dist

            cp -a .output/public/. dist/

          elif [ -f ".output/index.html" ]; then
            echo "Found: .output/index.html"

            rm -rf dist
            mkdir -p dist

            cp -a .output/. dist/

          elif [ -f "build/index.html" ]; then
            echo "Found: build/index.html"

            rm -rf dist
            mkdir -p dist

            cp -a build/. dist/

          elif [ -f "dist/index.html" ]; then
            echo "Found: dist/index.html"

          else
            echo "ERROR: No index.html was found in the build output."
            echo ""
            echo "Full .output contents:"
            find .output -maxdepth 5 -type f 2>/dev/null | sort || true

            echo ""
            echo "Full build contents:"
            find build -maxdepth 5 -type f 2>/dev/null | sort || true

            echo ""
            echo "Full dist contents:"
            find dist -maxdepth 5 -type f 2>/dev/null | sort || true

            exit 1
          fi

          echo ""
          echo "Final Capacitor web directory:"
          find dist -maxdepth 4 -type f | sort | head -300

      - name: Verify web build
        run: |
          echo "Checking final build output..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "SUCCESS: dist/index.html exists."
          echo ""
          echo "dist size:"
          du -sh dist

      - name: Initialize Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Verify Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not created."
            exit 1
          fi

          echo "Android project found successfully."

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salman-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
