name: Build Salman AI Clean Offline & Online Hybrid APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Generate Matched UI
        run: |
          rm -rf www
          mkdir -p www

          npm run build || npx vite build || true

          for dir in dist .output/public build out; do
            if [ -d "$dir" ]; then
              cp -r $dir/* www/ 2>/dev/null || true
            fi
          done

          LOGO_SRC=""
          for p in "public/logo.png" "public/icon-512.png" "logo.png" "src/logo.png"; do
            if [ -f "$p" ]; then LOGO_SRC="$p"; break; fi
          done
          if [ -n "$LOGO_SRC" ]; then cp "$LOGO_SRC" www/logo.png; fi

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Salman AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
              html, body { width: 100%; height: 100%; background-color: #090d16; color: #f8fafc; overflow: hidden; }

              #offline-app { display: flex; flex-direction: column; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; background-color: #090d16; }

              /* الهيدر العلوي المتناسق */
              .top-nav { height: 60px; background-color: #090d16; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; position: relative; z-index: 10; }
              .btn-new-chat { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
              .btn-new-chat:active { background: rgba(16, 185, 129, 0.2); }
              .model-select { background: #131b2e; border: 1px solid #1e293b; color: #e2e8f0; padding: 6px 12px; border-radius: 12px; font-size: 13px; outline: none; cursor: pointer; text-align: center; }
              .btn-menu { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 4px; }

              /* جسم الصفحة */
              .main-body { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
              
              /* الشاشة الرئيسية للترحيب (مطابقة للرسمية) */
              .welcome-view { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 20px; }
              .logo-card { width: 84px; height: 84px; background-color: #111827; border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
              .logo-card img { width: 56px; height: 56px; object-fit: contain; }
              .welcome-title { font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
              .welcome-desc { font-size: 14px; color: #64748b; }

              /* قائمة المحادثات */
              .chat-list { display: none; flex-direction: column; gap: 14px; padding: 16px; }
              .msg-user { align-self: flex-start; background: #10b981; color: #022c22; padding: 10px 16px; border-radius: 18px 18px 4px 18px; font-size: 14px; font-weight: 600; max-width: 82%; word-break: break-word; }
              .msg-ai { align-self: stretch; background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
              .ai-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #10b981; }
              .ai-header img { width: 20px; height: 20px; border-radius: 6px; }
              .ai-text { font-size: 14px; color: #cbd5e1; line-height: 1.5; }

              /* حقل الإدخال السفلي */
              .bottom-bar { padding: 12px 14px; background-color: #090d16; border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; gap: 10px; }
              .input-box { flex: 1; background-color: #131b2e; border: 1px solid #1e293b; border-radius: 28px; padding: 4px 14px; display: flex; align-items: center; gap: 8px; }
              .btn-plus { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; padding: 2px 4px; }
              .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 14px; direction: rtl; }
              .input-box input::placeholder { color: #475569; }
              .btn-send { width: 40px; height: 40px; background-color: #10b981; border: none; border-radius: 50%; color: #022c22; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
              .btn-send svg { width: 18px; height: 18px; fill: currentColor; transform: rotate(180deg); }

              /* القائمة الجانبية */
              .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
              .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #0f172a; z-index: 101; transition: right 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid rgba(255,255,255,0.08); }
              .sidebar.open { right: 0; }
              .sidebar-title { font-weight: bold; font-size: 16px; color: #10b981; display: flex; justify-content: space-between; align-items: center; }
              .close-sidebar { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
              .menu-item { background: #1e293b; color: #f8fafc; border: none; padding: 12px; border-radius: 10px; text-align: right; font-size: 14px; cursor: pointer; }

              /* إطار الإنترنت المباشر */
              #live-frame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 2; background-color: #090d16; display: none; }
            </style>
          </head>
          <body>

            <iframe id="live-frame" src="https://salman-ai.lovable.app" allow="autoplay; camera; microphone; clipboard-read; clipboard-write"></iframe>

            <div id="offline-app">
              <div class="top-nav">
                <button class="btn-new-chat" onclick="resetChat()">
                  <span>+</span> محادثة جديدة
                </button>
                <select class="model-select">
                  <option>Google Gemini Flash</option>
                  <option>GPT-4o Mini</option>
                  <option>Claude 3.5 Sonnet</option>
                </select>
                <button class="btn-menu" onclick="toggleSidebar()">≡</button>
              </div>

              <div class="main-body" id="main-body">
                <div class="welcome-view" id="welcome-view">
                  <div class="logo-card">
                    <img src="logo.png" alt="Salman AI" onerror="this.style.display='none'">
                  </div>
                  <h1 class="welcome-title">مرحباً بك مع Salman AI</h1>
                  <p class="welcome-desc">مرحباً بك! أنا جاهز لمساعدتك في أي وقت...</p>
                </div>

                <div class="chat-list" id="chat-list"></div>
              </div>

              <div class="bottom-bar">
                <div class="input-box">
                  <button class="btn-plus">+</button>
                  <input type="text" id="user-input" placeholder="اكتب رسالتك لـ Salman AI..." onkeypress="handleKey(event)">
                </div>
                <button class="btn-send" onclick="sendMessage()">
                  <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
              </div>

              <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
              <div class="sidebar" id="sidebar">
                <div class="sidebar-title">
                  <span>Salman AI</span>
                  <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
                </div>
                <button class="menu-item" onclick="resetChat(); toggleSidebar();">+ محادثة جديدة</button>
                <div style="margin-top:auto; font-size: 12px; color: #64748b;">الوضع الحقيقي: أوفلاين</div>
              </div>
            </div>

            <script>
              const liveFrame = document.getElementById('live-frame');
              const offlineApp = document.getElementById('offline-app');
              const welcomeView = document.getElementById('welcome-view');
              const chatList = document.getElementById('chat-list');
              const userInput = document.getElementById('user-input');
              const sidebar = document.getElementById('sidebar');
              const sidebarOverlay = document.getElementById('sidebar-overlay');

              function checkConnection() {
                if (navigator.onLine) {
                  liveFrame.style.display = 'block';
                  offlineApp.style.display = 'none';
                } else {
                  liveFrame.style.display = 'none';
                  offlineApp.style.display = 'flex';
                }
              }

              function sendMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                welcomeView.style.display = 'none';
                chatList.style.display = 'flex';

                const userDiv = document.createElement('div');
                userDiv.className = 'msg-user';
                userDiv.innerText = text;
                chatList.appendChild(userDiv);

                userInput.value = '';

                setTimeout(() => {
                  const aiDiv = document.createElement('div');
                  aiDiv.className = 'msg-ai';
                  aiDiv.innerHTML = `
                    <div class="ai-header">
                      <img src="logo.png" alt="AI" onerror="this.style.display='none'">
                      <span>Salman AI</span>
                    </div>
                    <div class="ai-text">
                      أنت تعمل حالياً في وضع الأوفلاين (بدون إنترنت). قم بالاتصال بالشبكة للاستجابة المباشرة.
                    </div>
                  `;
                  chatList.appendChild(aiDiv);
                  document.getElementById('main-body').scrollTop = document.getElementById('main-body').scrollHeight;
                }, 300);
              }

              function handleKey(e) {
                if (e.key === 'Enter') sendMessage();
              }

              function resetChat() {
                chatList.innerHTML = '';
                chatList.style.display = 'none';
                welcomeView.style.display = 'flex';
              }

              function toggleSidebar() {
                const isOpen = sidebar.classList.contains('open');
                if (isOpen) {
                  sidebar.classList.remove('open');
                  sidebarOverlay.style.display = 'none';
                } else {
                  sidebar.classList.add('open');
                  sidebarOverlay.style.display = 'block';
                }
              }

              window.addEventListener('online', checkConnection);
              window.addEventListener('offline', checkConnection);
              window.addEventListener('load', checkConnection);
            </script>
          </body>
          </html>
          EOF

      - name: Setup Capacitor Shell
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --save-dev
          echo '{"appId":"com.salman.ai","appName":"Salman AI","webDir":"www","server":{"androidScheme":"https","hostname":"localhost","cleartext":true}}' > capacitor.config.json
          npx cap add android || true

      - name: Apply Custom Logo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          LOGO=""
          for p in "public/logo.png" "public/icon-512.png" "logo.png" "src/logo.png"; do
            if [ -f "$p" ]; then LOGO="$p"; break; fi
          done

          if [ -n "$LOGO" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            
            convert "$LOGO" -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO" -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO" -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO" -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO" -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-$DPI"
              if [ -d "$DIR" ]; then
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png" || true
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: Configure Android Permissions & Sync
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          BUILD_TOOLS_DIR=$(ls -d$ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4$RAW_APK output_apk/Salman_AI.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman_AI.apk

      - name: Upload Final Signed APK to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v37.0.${{ github.run_number }}
          name: Salman AI Official Release v37.0.${{ github.run_number }}
          files: output_apk/Salman_AI.apk
