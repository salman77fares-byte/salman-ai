name: Build Salman AI Official Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Build Web App & Configure Relative Paths
        run: |
          npm install --legacy-peer-deps
          
          # البناء بمسارات نسبية لحل مشكلة الشاشة البيضاء في أندرويد
          npx vite build --base=./ || npm run build || true

          rm -rf www
          mkdir -p www

          # نسخ مخرجات البناء إلى مجلد www
          if [ -d "dist" ]; then cp -r dist/* www/ ; fi
          if [ -d "build" ] && [ ! -f "www/index.html" ]; then cp -r build/* www/ ; fi
          if [ -d ".output/public" ] && [ ! -f "www/index.html" ]; me cp -r .output/public/* www/ ; fi

          # إنشاء ملف index.html احتياطي إن لم يوجد
          if [ ! -f "www/index.html" ]; then
            cat <<EOF > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Salman AI</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi

      - name: 🌐 Inject Global Network Sensor & Crash Handler
        run: |
          # حقن مستشعر الشبكة ومعالج الأخطاء تلقائياً في index.html
          node -e '
          const fs = require("fs");
          let html = fs.readFileSync("www/index.html", "utf8");

          const injectedScript = `
          <script>
            // معالج الأخطاء لمنع الشاشة البيضاء وإظهار سبب الخطأ إن وجد
            window.addEventListener("error", function(e) {
              console.error("Runtime Error:", e.message);
              var errDiv = document.getElementById("debug-error-box");
              if (!errDiv) {
                errDiv = document.createElement("div");
                errDiv.id = "debug-error-box";
                errDiv.style.cssText = "position:fixed;top:0;left:0;width:100%;background:#d9534f;color:#fff;padding:10px;z-index:999999;font-size:12px;direction:ltr;";
                document.body.appendChild(errDiv);
              }
              errDiv.innerText = "App Init Error: " + (e.message || "Unknown JS Error");
            });

            // مستشعر إنترنت تلقائي يعمل على مستوى النظام والأوفلاين
            window.SalmanNetworkSensor = {
              isOnline: navigator.onLine,
              init: function() {
                var self = this;
                window.addEventListener("online", function() { self.update(true); });
                window.addEventListener("offline", function() { self.update(false); });
                self.update(navigator.onLine);
              },
              update: function(status) {
                this.isOnline = status;
                window.dispatchEvent(new CustomEvent("networkStatusChange", { detail: { connected: status } }));
                var banner = document.getElementById("offline-status-banner");
                if (!status) {
                  if (!banner) {
                    banner = document.createElement("div");
                    banner.id = "offline-status-banner";
                    banner.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#d9534f;color:#fff;text-align:center;padding:8px;z-index:99999;font-size:13px;font-family:sans-serif;font-weight:bold;";
                    banner.innerText = "⚠️ أنت غير متصل بالإنترنت (وضع الأوفلاين)";
                    document.body.appendChild(banner);
                  }
                } else {
                  if (banner) banner.remove();
                }
              }
            };
            document.addEventListener("DOMContentLoaded", function() {
              window.SalmanNetworkSensor.init();
            });
          </script>
          `;

          if (!html.includes("SalmanNetworkSensor")) {
            html = html.replace("</head>", injectedScript + "\n</head>");
            fs.writeFileSync("www/index.html", html);
          }
          '

      - name: 🚀 Setup Capacitor Shell & Network Plugin
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/network@5.0.7 --save-dev
          
          # ضبط إعدادات Capacitor لتشغيل الأوفلاين والسيرفر المحلي
          node -e '
          const fs = require("fs");
          const config = {
            appId: "com.salman.ai",
            appName: "Salman AI",
            webDir: "www",
            server: {
              androidScheme: "https",
              hostname: "localhost",
              cleartext: true
            }
          };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '

          npx cap add android || true

      - name: 🖼️ Process App Logo (Safe Fallback)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          LOGO_PATH=""
          for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png" "public/icon.png"; do
            if [ -f "$p" ]; then
              LOGO_PATH="$p"
              break
            fi
          done

          if [ -n "$LOGO_PATH" ]; then
            convert "$LOGO_PATH" -resize 36x36 -gravity center -background none -extent 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            convert "$LOGO_PATH" -resize 54x54 -gravity center -background none -extent 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            convert "$LOGO_PATH" -resize 72x72 -gravity center -background none -extent 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            convert "$LOGO_PATH" -resize 108x108 -gravity center -background none -extent 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            convert "$LOGO_PATH" -resize 144x144 -gravity center -background none -extent 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-$DPI"
              if [ -f "$DIR/ic_launcher.png" ]; then
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png" || true
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: 🛠️ Configure Android Permissions & Network Manifest
        run: |
          cd android

          # إضافة صلاحيات شبكة أندرويد مباشرة في AndroidManifest.xml
          node -e '
          const fs = require("fs");
          const manifestPath = "app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, "utf8");
            
            const permissions = `
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
            `;
            
            if (!manifest.includes("ACCESS_NETWORK_STATE")) {
              manifest = manifest.replace("<application", permissions + "\n    <application");
            }
            if (!manifest.includes("android:usesCleartextTraffic")) {
              manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }
            fs.writeFileSync(manifestPath, manifest);
          }
          '

          chmod +x gradlew

      - name: 📱 Sync Native Assets
        run: npx cap sync android

      - name: 🏗️ Build Optimized Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 🔑 Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 $RAW_APK output_apk/Salman_AI.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman_AI.apk

      - name: 📦 Upload Final APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v18.0.${{ github.run_number }}
          name: Salman AI Final APK v18.0.${{ github.run_number }}
          files: output_apk/Salman_AI.apk
