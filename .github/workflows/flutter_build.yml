name: Build Complete Offline Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js & Build Web Assets
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Node Dependencies & Build SPA
      run: |
        npm install --legacy-peer-deps
        npm run build || npx vite build --base=./

        # تجميع كافة ملفات الـ Web داخل مجلد موحد www
        mkdir -p www
        [ -d ".output/public" ] && cp -r .output/public/* www/ 2>/dev/null || true
        [ -d "dist/client" ] && cp -r dist/client/* www/ 2>/dev/null || true
        [ -d "dist" ] && cp -r dist/* www/ 2>/dev/null || true

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: Build Flutter App Shell
      run: |
        # 1. إنشاء مشروع Flutter
        flutter create --org com.salman --project-name salman_ai flutter_app
        cd flutter_app

        # 2. إضافة مكتبة WebView
        flutter pub add webview_flutter

        # 3. نقل ملفات الـ Web المبنية إلى داخل أصول Flutter ليعمل أوفلاين
        mkdir -p assets/www
        cp -r ../www/* assets/www/

        # 4. تحديث pubspec.yaml لتسجيل كافة مجلدات الأصول
        node -e "
          const fs = require('fs');
          let yaml = fs.readFileSync('pubspec.yaml', 'utf8');
          yaml += '\n  assets:\n    - assets/www/\n';
          
          // إضافة كافة المجلدات الفرعية تلقائياً
          const getDirs = (dir) => {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const filePath = dir + '/' + file;
              const stat = fs.statSync(filePath);
              if (stat && stat.isDirectory()) {
                results.push(filePath + '/');
                results = results.concat(getDirs(filePath));
              }
            });
            return results;
          };
          
          if (fs.existsSync('assets/www')) {
            getDirs('assets/www').forEach(d => {
              yaml += '    - ' + d + '\n';
            });
          }
          fs.writeFileSync('pubspec.yaml', yaml);
        "

        # 5. كتابة كود Flutter المكتمل (خلفية سوداء + أوفلاين + شريط شفاف)
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:flutter/services.dart';
        import 'package:webview_flutter/webview_flutter.dart';

        void main() {
          WidgetsFlutterBinding.ensureInitialized();
          SystemChrome.setSystemUIOverlayStyle(
            const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
            ),
          );
          runApp(const MyApp());
        }

        class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark(),
              home: const WebViewScreen(),
            );
          }
        }

        class WebViewScreen extends StatefulWidget {
          const WebViewScreen({super.key});

          @override
          State<WebViewScreen> createState() => _WebViewScreenState();
        }

        class _WebViewScreenState extends State<WebViewScreen> {
          late final WebViewController _controller;

          @override
          void initState() {
            super.initState();
            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..setBackgroundColor(const Color(0xFF0B0B0B))
              ..loadFlutterAsset('assets/www/index.html');
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFF0B0B0B),
              body: SafeArea(
                child: WebViewWidget(controller: _controller),
              ),
            );
          }
        }
        EOF

        # 6. إضافة إذن الإنترنيت والأذونات الأساسية
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

    - name: Build Android Release APK
      run: |
        cd flutter_app
        flutter build apk --release

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v3.0.${{ github.run_number }}
        name: Salman AI Offline App v3.0.${{ github.run_number }}
        files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
