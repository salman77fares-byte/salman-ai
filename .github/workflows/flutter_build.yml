name: Build Salman AI APK

on:
  push:
    branches: [ "main", "master", "v1", "v*" ]
  pull_request:
    branches: [ "main", "master", "v1" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps || npm install --force

      - name: Build Web Assets
        run: |
          npm run build || npx vite build --base=./ || true
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>Salman AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salman-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
