name: Build Salman AI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build web application
        run: |
          npm run build

      - name: Verify web build
        run: |
          echo "Checking build output..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Contents of dist:"
          find dist -maxdepth 3 -type f | sort | head -200

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            echo "The web application cannot be packaged into Capacitor yet."
            exit 1
          fi

          echo "SUCCESS: dist/index.html exists."

      - name: Install Capacitor Android
        run: |
          npx cap sync android

      - name: Verify Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          echo "Android project found."

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salman-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
