name: Build Salman AI Official Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Build Nitro / TanStack Web Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build --base=./

          rm -rf www
          mkdir -p www

          # Nitro / Vinxi output path support
          if [ -d ".output/public" ]; then cp -r .output/public/* www/ ;
          elif [ -d "dist" ]; then cp -r dist/* www/ ;
          elif [ -d "build" ]; then cp -r build/* www/ ;
          fi

          # Fallback check for SPA routes
          if [ ! -f "www/index.html" ]; then
            INDEX_FOUND=$(find www -name "index.html" | head -n 1)
            if [ -n "$INDEX_FOUND" ]; then
              cp "$INDEX_FOUND" www/index.html
            else
              cat <<EOF > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Salman AI</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
            fi
          fi

      - name: 🚀 Setup Capacitor Shell & Network Plugin
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/network@5.0.7 --save-dev
          npx cap init "Salman AI" "com.salman.ai" --web-dir "www"
          npx cap add android

      - name: 🖼️ Process & Pad App Logo
        run: |
          LOGO_PATH=""
          for p in "public/logo.png" "logo.png" "src/logo.png" "public/favicon.png" "public/icon.png"; do
            if [ -f "$p" ]; then
              LOGO_PATH="$p"
              break
            fi
          done

          if [ -n "$LOGO_PATH" ]; then
            npm install jimp --save-dev
            node -e '
            const Jimp = require("jimp");
            const path = require("path");
            const fs = require("fs");

            async function processLogo() {
              const image = await Jimp.read(process.env.LOGO_PATH);
              const targets = [
                { dir: "android/app/src/main/res/mipmap-mdpi", size: 48 },
                { dir: "android/app/src/main/res/mipmap-hdpi", size: 72 },
                { dir: "android/app/src/main/res/mipmap-xhdpi", size: 96 },
                { dir: "android/app/src/main/res/mipmap-xxhdpi", size: 144 },
                { dir: "android/app/src/main/res/mipmap-xxxhdpi", size: 192 }
              ];

              for (const t of targets) {
                if (!fs.existsSync(t.dir)) fs.mkdirSync(t.dir, { recursive: true });
                const paddedSize = Math.round(t.size * 0.75);
                const canvas = new Jimp(t.size, t.size, 0x00000000);
                const resized = image.clone().resize(paddedSize, paddedSize);
                const offset = Math.round((t.size - paddedSize) / 2);
                canvas.composite(resized, offset, offset);

                await canvas.writeAsync(path.join(t.dir, "ic_launcher.png"));
                await canvas.writeAsync(path.join(t.dir, "ic_launcher_round.png"));
                await canvas.writeAsync(path.join(t.dir, "ic_launcher_foreground.png"));
              }
            }
            processLogo();
            '
          fi
        env:
          LOGO_PATH: ${{ env.LOGO_PATH }}

      - name: 🛠️ Configure Android Permissions & Network Specs
        run: |
          cd android

          node -e '
          const fs = require("fs");
          const p = "build.gradle";
          if (fs.existsSync(p)) {
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes("resolutionStrategy")) {
              content += `\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        }\n    }\n}\n`;
              fs.writeFileSync(p, content);
            }
          }
          '

          chmod +x gradlew
          
          # Inject full network permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' app/src/main/AndroidManifest.xml
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' app/src/main/AndroidManifest.xml

      - name: 📱 Sync Web Assets & Plugins
        run: npx cap sync android

      - name: 🏗️ Build Optimized Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 🔑 Sign & ZipAlign APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkeypair -v -keystore release.keystore -storepass salman123 -alias salman -keypass salman123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SalmanAI"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 $RAW_APK output_apk/Salman_AI.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:salman123 --ks-key-alias salman --key-pass pass:salman123 output_apk/Salman_AI.apk

      - name: 📦 Upload Optimized APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v11.0.${{ github.run_number }}
          name: Salman AI Final APK v11.0.${{ github.run_number }}
          files: output_apk/Salman_AI.apk
